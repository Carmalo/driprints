<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DriPrints | Objetos úteis para o dia a dia</title>
<meta name="description" content="DriPrints: objetos úteis para o dia a dia, feitos por encomenda.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1FAEE; --surface:#FFFFFF; --surface-2:#E3F2F2; --text:#1D3557; --muted:#4A607E;
  --line:#CFE3E4; --accent:#5271FF; --accent-strong:#1800AD; --hover-ink:#FFFFFF;
  --cyan:#38B6FF; --navy:#004AAD; --arch:#1800AD; --arch-in:#38B6FF;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13223A; --surface:#1D3557; --surface-2:#22406A; --text:#F1FAEE; --muted:#B9CFE0;
    --line:#2E4D78; --accent:#6E89FF; --accent-strong:#A9B8FF; --hover-ink:#0E1A2E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13223A; --surface:#1D3557; --surface-2:#22406A; --text:#F1FAEE; --muted:#B9CFE0;
  --line:#2E4D78; --accent:#6E89FF; --accent-strong:#A9B8FF; --hover-ink:#0E1A2E;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
body{margin:0; background:var(--bg); color:var(--text); font-family:"Jost","Futura","Century Gothic","Avenir Next",system-ui,sans-serif; font-size:18px; line-height:1.55; -webkit-font-smoothing:antialiased}
img{max-width:100%; display:block}
a{color:inherit}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--cyan); outline-offset:3px; border-radius:6px}
.wrap{max-width:1120px; margin:0 auto; padding:0 24px}
[hidden]{display:none!important}

/* header */
header{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg)}
.bar{display:flex; align-items:center; justify-content:space-between; height:68px; gap:16px}
.brand{display:flex; align-items:center}
.brand svg{height:22px; width:auto}
nav{display:flex; align-items:center; gap:28px; font-size:16px}
nav a{text-decoration:none; color:var(--muted)}
nav a:hover{color:var(--text)}
@media (max-width:640px){nav a.hide-sm{display:none} .brand svg{height:18px} nav{gap:14px}}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:10px; border:0; cursor:pointer; font-weight:500; text-decoration:none; background:var(--accent); color:#fff; padding:14px 26px; border-radius:999px; transition:background .15s}
.btn:hover{background:var(--accent-strong); color:var(--hover-ink)}
.btn.small{padding:9px 18px; font-size:15px}
.btn.ghost{background:transparent; color:var(--text); border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface-2); color:var(--text)}
.badge{display:inline-grid; place-items:center; min-width:22px; height:22px; padding:0 6px; border-radius:999px; background:#fff; color:var(--accent); font-size:13px; font-weight:600}

/* arch motif (echo of the logo symbol) */
.tape{position:absolute; left:-12%; right:-12%; top:46%; z-index:3; transform:rotate(-14deg); background:repeating-linear-gradient(-45deg,#FFD23F 0 22px,#1B1B1B 22px 44px); padding:7px 0; box-shadow:0 6px 18px rgba(0,0,0,.25); pointer-events:none}
.tape span{display:block; background:#FFD23F; color:#1B1B1B; font-weight:700; letter-spacing:.12em; text-transform:uppercase; text-align:center; padding:10px 0; font-size:clamp(16px,3.2vw,26px)}
.pic.has-tape{position:relative}
.redact{display:inline-block; height:.9em; border-radius:4px; background:var(--text); opacity:.85; vertical-align:middle}
.redact-lines{display:grid; gap:10px; margin:6px 0 14px}
.redact-lines .redact{display:block; height:14px}
#addBtn:disabled{opacity:.55; cursor:not-allowed; background:var(--accent); color:#fff}
.pic.has-tape img,.stage.has-tape img{filter:blur(2px) brightness(.9)}
.stage{position:relative; justify-self:center; width:min(100%, 420px); aspect-ratio:316/440}
.arch{position:absolute; inset:0; border-radius:999px 999px 0 0; background:var(--arch); overflow:hidden}
.arch::before{content:""; position:absolute; left:0; right:0; bottom:54px; height:62%; border-radius:999px 999px 0 0; background:var(--arch-in); transform-origin:bottom; animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both .1s}
.arch::after{content:""; position:absolute; left:0; right:0; bottom:0; height:54px; background:linear-gradient(var(--accent) 0 55%, var(--navy) 55% 100%)}
.stage img{position:absolute; left:50%; bottom:20px; height:94%; width:auto; max-width:none; transform:translateX(-50%); filter:drop-shadow(0 18px 18px rgba(0,0,40,.35)); animation:drop 1s cubic-bezier(.2,.7,.2,1) both .35s}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes drop{from{opacity:0; transform:translate(-50%,-24px)}to{opacity:1; transform:translate(-50%,0)}}

.hero{display:grid; grid-template-columns:1.05fr .95fr; gap:40px; align-items:center; padding-top:56px; padding-bottom:24px}
.hero h1{font-weight:300; font-size:clamp(46px, 6.6vw, 84px); line-height:.98; letter-spacing:-.02em; margin:0 0 24px}
.lead{font-size:clamp(19px,2vw,22px); max-width:32ch; color:var(--muted); margin:0 0 32px}
@media (max-width:860px){.hero{grid-template-columns:1fr; padding-top:32px}.stage{width:min(100%,340px); order:-1}}

section{padding:88px 0}
h2{font-weight:400; font-size:clamp(32px,4.4vw,48px); line-height:1.05; letter-spacing:-.015em; margin:0 0 16px}
.intro{color:var(--muted); max-width:52ch; margin:0 0 48px}
.band{background:var(--surface-2)}

/* catalog */
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:40px 28px}
.card{text-decoration:none; display:flex; flex-direction:column; color:inherit}
.card .pic{aspect-ratio:4/5; background:var(--surface-2); border-radius:999px 999px 0 0; border-bottom:6px solid var(--accent); display:flex; align-items:flex-end; justify-content:center; padding:28px 24px 16px; overflow:hidden; transition:background .2s}
.card .pic img{height:100%; width:auto; object-fit:contain; transition:transform .25s}
.card:hover .pic{background:var(--arch-in)}
.card:hover .pic img{transform:translateY(-6px)}
.card h3{font-size:22px; font-weight:500; margin:18px 0 4px}
.card p{margin:0 0 10px; color:var(--muted); font-size:16px}
.card .price{font-weight:500}
.soon{border:2px dashed var(--line); border-radius:999px 999px 0 0; aspect-ratio:4/5; display:grid; place-items:center; text-align:center; padding:32px; color:var(--muted)}
.soon b{display:block; color:var(--text); font-weight:500; font-size:20px; margin-bottom:4px}

/* how to order */
.how{display:grid; grid-template-columns:repeat(3,1fr); gap:32px; list-style:none; padding:0; margin:0; counter-reset:h}
.how li{counter-increment:h; border-top:2px solid var(--accent); padding-top:18px}
.how h3{font-size:20px; font-weight:500; margin:0 0 6px}
.how h3::before{content:counter(h) ". "; color:var(--accent)}
.how p{margin:0; color:var(--muted); font-size:16px}
@media (max-width:760px){.how{grid-template-columns:1fr}}

/* product view */
.back{display:inline-block; margin-top:28px; text-decoration:none; color:var(--muted); font-size:16px}
.back:hover{color:var(--text)}
.pv{display:grid; grid-template-columns:.95fr 1.05fr; gap:56px; align-items:start; padding-top:24px}
.pv .stage{position:sticky; top:100px}
.pv h1{font-weight:300; font-size:clamp(40px,5.4vw,68px); line-height:1; letter-spacing:-.02em; margin:0 0 18px}
.pv .lead{margin-bottom:24px}
.pv .price-big{font-size:34px; font-weight:500; margin-bottom:8px}
.pv .price-big small{font-size:14px; font-weight:400; color:var(--muted); margin-left:8px}
.opts{border-top:1px solid var(--line); margin:16px 0 24px}
.row{display:flex; justify-content:space-between; align-items:center; gap:16px; padding:16px 0; border-bottom:1px solid var(--line)}
.row .lbl{font-weight:500}
.row .sub{display:block; font-size:14px; color:var(--muted); font-weight:400}
.seg{display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; flex-shrink:0}
.seg input{position:absolute; opacity:0; pointer-events:none}
.seg label{padding:10px 18px; cursor:pointer; font-size:15px; transition:background .15s,color .15s}
.seg input:checked+label{background:var(--accent); color:#fff}
.seg input:focus-visible+label{outline:2px solid var(--accent-strong); outline-offset:-2px}
.stepper{display:flex; align-items:center; border:1px solid var(--line); border-radius:999px; overflow:hidden; flex-shrink:0}
.stepper button{width:44px; height:44px; border:0; background:transparent; font-size:22px; cursor:pointer}
.stepper button:hover{background:var(--surface-2)}
.stepper button:disabled{opacity:.35; cursor:default; background:transparent}
.stepper output{min-width:34px; text-align:center; font-weight:500}
.swatches{display:flex; gap:10px}
.swatches input{position:absolute; opacity:0; width:1px; height:1px}
.swatches label{width:38px; height:38px; border-radius:50%; cursor:pointer; border:2px solid var(--line); box-shadow:inset 0 0 0 3px var(--surface)}
.swatches input:checked+label{border-color:var(--accent)}
.swatches input:focus-visible+label{outline:3px solid var(--cyan); outline-offset:2px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.facts{display:flex; flex-wrap:wrap; gap:10px; padding:0; margin:24px 0 0; list-style:none; font-size:15px}
.facts li{border:1px solid var(--line); border-radius:999px; padding:6px 14px; color:var(--muted)}
@media (max-width:860px){.pv{grid-template-columns:1fr; gap:24px}.pv .stage{position:relative; top:0; width:min(100%,320px)}}

.feat{display:grid; grid-template-columns:repeat(2,1fr); border-top:1px solid var(--line)}
.feat div{padding:28px 32px 32px 0; border-bottom:1px solid var(--line)}
.feat div:nth-child(odd){border-right:1px solid var(--line)}
.feat div:nth-child(even){padding-left:32px}
.feat h3{font-size:22px; font-weight:500; margin:0 0 6px}
.feat p{margin:0; color:var(--muted); max-width:42ch}
@media (max-width:700px){.feat{grid-template-columns:1fr}.feat div,.feat div:nth-child(even){padding:24px 0; border-right:0}}

.steps{display:grid; grid-template-columns:repeat(5,1fr); gap:20px; list-style:none; padding:0; margin:0; counter-reset:s}
.steps li{counter-increment:s}
.steps figure{margin:0 0 16px; height:260px; display:flex; align-items:flex-end; justify-content:center; border-bottom:2px solid var(--accent)}
.steps img{max-height:250px; width:auto; object-fit:contain}
.steps li:first-child img{max-height:150px}
.steps h3{font-size:19px; font-weight:500; margin:0 0 4px}
.steps h3::before{content:counter(s) ". "; color:var(--accent)}
.steps p{margin:0; font-size:16px; color:var(--muted)}
@media (max-width:900px){.steps{grid-template-columns:none; grid-auto-flow:column; grid-auto-columns:64%; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:16px}.steps li{scroll-snap-align:start}}
.note{margin-top:40px; font-size:16px; color:var(--muted); max-width:62ch}

.specs-grid{display:grid; grid-template-columns:.8fr 1.2fr; gap:56px; align-items:start}
dl.specs{margin:0; display:grid; grid-template-columns:auto 1fr; border-top:1px solid var(--line)}
dl.specs dt,dl.specs dd{padding:16px 0; border-bottom:1px solid var(--line); margin:0}
dl.specs dt{color:var(--muted); padding-right:32px; font-size:16px}
@media (max-width:760px){.specs-grid{grid-template-columns:1fr; gap:24px}}

details{border-bottom:1px solid var(--line); padding:18px 0}
details:first-of-type{border-top:1px solid var(--line)}
summary{cursor:pointer; font-weight:500; list-style:none; display:flex; justify-content:space-between; gap:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+"; color:var(--accent); font-size:24px; line-height:1}
details[open] summary::after{content:"–"}
details p{margin:10px 0 0; color:var(--muted); max-width:62ch}

/* cart drawer */
.scrim{position:fixed; inset:0; background:rgba(10,20,40,.45); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s}
.drawer{position:fixed; top:0; right:0; bottom:0; width:min(420px,100%); background:var(--bg); z-index:41; transform:translateX(100%); transition:transform .25s cubic-bezier(.2,.7,.2,1); display:flex; flex-direction:column; padding:calc(env(safe-area-inset-top,0px) + 20px) 24px calc(env(safe-area-inset-bottom,0px) + 24px); }
.cart-open .scrim{opacity:1; pointer-events:auto}
.cart-open .drawer{transform:none; box-shadow:-20px 0 40px rgba(0,0,40,.15)}
.drawer-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px}
.drawer-head h2{font-size:28px; margin:0}
.x{width:44px; height:44px; border:0; background:transparent; font-size:28px; cursor:pointer; border-radius:50%}
.x:hover{background:var(--surface-2)}
.items{flex:1; overflow:auto; list-style:none; margin:0; padding:0}
.item{display:grid; grid-template-columns:64px 1fr auto; gap:14px; padding:16px 0; border-bottom:1px solid var(--line); align-items:center}
.item .thumb{width:64px; height:80px; border-radius:999px 999px 0 0; background:var(--surface-2); display:flex; align-items:flex-end; justify-content:center; padding:6px; border-bottom:3px solid var(--accent)}
.item .thumb img{height:100%; width:auto}
.item b{font-weight:500; display:block}
.item small{color:var(--muted); font-size:14px; display:block}
.item .side{text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:8px}
.item .stepper button{width:34px; height:34px; font-size:18px}
.item .stepper output{min-width:24px; font-size:15px}
.empty{color:var(--muted); padding:32px 0}
.drawer-foot{border-top:1px solid var(--line); padding-top:16px}
.total{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:16px}
.sum{display:flex; justify-content:space-between; font-size:16px; color:var(--muted); margin-bottom:6px}
.total strong{font-size:28px; font-weight:500}
.drawer-foot .btn{width:100%}
.fine{font-size:14px; color:var(--muted); margin:12px 0 0; text-align:center}

footer{border-top:1px solid var(--line); padding:40px 0 48px; font-size:15px; color:var(--muted); margin-top:40px}
footer .f{display:flex; gap:24px; justify-content:space-between; align-items:flex-start; flex-wrap:wrap}
footer svg{height:40px; width:auto}
footer p{margin:0 0 6px; max-width:60ch}

.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,20px); background:var(--text); color:var(--bg); padding:12px 20px; border-radius:999px; font-size:15px; opacity:0; pointer-events:none; transition:.25s; z-index:50}
.toast.show{opacity:1; transform:translate(-50%,0)}

/* vista interativa */
.vw{position:relative; aspect-ratio:16/10; background:var(--surface); border:1px solid var(--line); border-radius:28px; overflow:hidden}
.vw canvas{display:block; width:100%; height:100%}
.vw-load{position:absolute; inset:0; display:grid; place-items:center; margin:0; color:var(--muted)}
.vw-ctl{position:absolute; left:50%; bottom:16px; transform:translateX(-50%); display:flex; gap:8px; flex-wrap:wrap; justify-content:center; width:max-content; max-width:calc(100% - 24px)}
.chip{border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:999px; padding:8px 16px; font-size:15px; cursor:pointer}
.chip.on{background:var(--accent); color:#fff; border-color:transparent}
@media (max-width:640px){.vw{aspect-ratio:4/5}}
</style>
</head>

const $ = id => document.getElementById(id);
const eur = v => v.toLocaleString("pt-PT",{style:"currency",currency:"EUR"});
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bar = w => `<span class="redact" style="width:${w}" aria-hidden="true"></span>`;
const bars = ws => `<span class="redact-lines" aria-label="Segredo">${ws.map(bar).join("")}</span>`;
const byId = id => PRODUTOS.find(p => p.id === id);
const app = $("app");

/* ---------- home ---------- */
function home(){
  const dest = PRODUTOS[0];
  const cards = PRODUTOS.map(p => `
    <a class="card" href="#${p.id}">
      <div class="pic${p.breve?" has-tape":""}"><img src="${p.imagem}" alt="${p.breve?"Produto secreto":esc(p.alt||p.nome)}" loading="lazy">${p.breve?`<div class="tape"><span>working...</span></div>`:""}</div>
      ${p.breve ? `<h3>${bar("60%")}</h3>${bars(["95%","70%"])}<span class="price">${bar("3.5em")}</span>` : `<h3>${esc(p.nome)}</h3>
      <p>${esc(p.resumo)}</p>
      <span class="price">${(p.extra||p.tamanhos) ? "desde " : ""}${eur(p.tamanhos ? Math.min(...p.tamanhos.map(t=>t[1])) : p.preco)}</span>`}
    </a>`).join("");

  <div class="wrap hero">
    <div>
      <h1>Objetos úteis para o dia a dia</h1>

  <section id="produtos">
    <div class="wrap">
      <h2>Produtos</h2>

      </div>

  <section id="como-encomendar" class="band">
    <div class="wrap">
      <h2>Como encomendar</h2>
      <p class="intro">Sem contas nem registos. Tudo se trata por WhatsApp.</p>

    <div class="row"><span class="lbl" id="lblTam">Tamanho</span>
      <div class="seg" role="radiogroup" aria-labelledby="lblTam">
        ${p.tamanhos.map(([t,v],i)=>`<input type="radio" name="tam" id="t${i}" value="${esc(t)}" ${i===0?"checked":""}><label for="t${i}">${esc(t)} · ${eur(v)}</label>`).join("")}
      </div></div>` : "";
  const swGroup = (key,label,list,cur) => `
    <div class="row"><span class="lbl" id="lbl_${key}">${label}<span class="sub" id="nome_${key}">${esc(cur)}</span></span>
      <div class="swatches" role="radiogroup" aria-labelledby="lbl_${key}">
        ${list.map((c,i)=>`<input type="radio" name="${key}" id="${key}${i}" value="${esc(c)}" ${i===0?"checked":""}><label for="${key}${i}" title="${esc(c)}" style="background:${CORES[c]||"#999"}"><span class="sr">${esc(c)}</span></label>`).join("")}
      </div></div>`;
  const sw = (p.cores ? swGroup("cor", p.cores2 ? "Cor principal" : "Cor", p.cores, st.cor) : "") + (p.cores2 ? swGroup("cor2", "Cor secundária", p.cores2, st.cor2) : "");
  const ex = p.extra ? `
    <div class="row"><span class="lbl" id="lblEx">${esc(p.extra.nome)}<span class="sub">${esc(p.extra.descricao)}, ${eur(p.extra.preco)} cada${p.extra.info?`, <span id="exInfo"></span>`:""}</span></span>
      <div class="stepper" role="group" aria-labelledby="lblEx"><button type="button" id="exM" aria-label="Menos um">−</button><output id="exN">0</output><button type="button" id="exP" aria-label="Mais um">+</button></div></div>` : "";
  const feat = p.destaques ? `<section><div class="wrap"><h2>Feito para o dia a dia</h2><p class="intro">${esc(p.resumo)}</p><div class="feat">${p.destaques.map(([t,d])=>`<div><h3>${esc(t)}</h3><p>${esc(d)}</p></div>`).join("")}</div></div></section>` : "";
  const mont = p.montagem ? `<section class="band"><div class="wrap"><h2>${esc(p.montagem.titulo||"Montagem")}</h2><p class="intro">${esc(p.montagem.intro||"")}</p>
      <ol class="steps">${p.montagem.passos.map(([img,t,d])=>`<li><figure><img src="${img}" alt="${esc(t)}" loading="lazy"></figure><h3>${esc(t)}</h3><p>${esc(d)}</p></li>`).join("")}</ol>
      ${p.montagem.nota?`<p class="note">${esc(p.montagem.nota)}</p>`:""}</div></section>` : "";
  const ui = p.viewer ? VIEW_UI[p.viewer] : null;
  const vw = ui ? `<section class="band"><div class="wrap"><h2>Vê de todos os ângulos</h2><p class="intro">${esc(ui.intro)}</p>
      <div class="vw"><canvas id="vwC" aria-label="Vista interativa do ${esc(p.nome)}"></canvas><p class="vw-load" id="vwLoad">A carregar…</p>
      <div class="vw-ctl">${ui.btns.map(([id,t])=>`<button type="button" class="chip" id="${id}">${esc(t)}</button>`).join("")}</div></div></div></section>` : "";
  const det = p.detalhes ? `<section><div class="wrap specs-grid"><div><h2>Detalhes</h2><p class="intro" style="margin-bottom:0">Tudo o que precisas de saber antes de encomendar.</p></div>
      <dl class="specs">${p.detalhes.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join("")}</dl></div></section>` : "";
  const faq = p.faq ? `<section class="band"><div class="wrap" style="max-width:820px"><h2>Perguntas frequentes</h2><p class="intro">Se a tua dúvida não estiver aqui, manda-nos mensagem.</p>
      ${p.faq.map(([q,a])=>`<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("")}</div></section>` : "";

  app.innerHTML = `
  <div class="wrap"><a class="back" href="#produtos">← Todos os produtos</a></div>
  <div class="wrap pv">
    <div class="stage${p.breve?" has-tape":""}"><div class="arch"></div><img src="${p.imagem}" alt="${p.breve?"Produto secreto":esc(p.alt||p.nome)}">${p.breve?`<div class="tape"><span>working...</span></div>`:""}</div>
    <div>
      <h1>${esc(p.nome)}</h1>
      <p class="lead">${esc(p.lead||p.resumo)}</p>
      <div class="price-big"><span id="pvPrice"></span></div>
      <div class="opts">${tm}${sw}${ex}
        <div class="row"><span class="lbl" id="lblQ">Quantidade</span>
          <div class="stepper" role="group" aria-labelledby="lblQ"><button type="button" id="qM" aria-label="Menos uma unidade">−</button><output id="qN">1</output><button type="button" id="qP" aria-label="Mais uma unidade">+</button></div></div>
      </div>
      <button class="btn" type="button" id="addBtn" ${p.breve?"disabled":""}>${p.breve?"Em breve":"Adicionar ao pedido"}</button>
      ${p.factos?`<ul class="facts">${p.factos.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`:""}
    </div>
  </div>
  ${feat}${vw}${mont}${det}${faq}`;

  const unit = () => basePrice(p, st.tam) + (p.extra ? st.extra*p.extra.preco : 0);
  function upd(){
    $("pvPrice").textContent = eur(unit()*st.qtd);
    $("qN").textContent = st.qtd; $("qM").disabled = st.qtd===1; $("qP").disabled = st.qtd>=20;
    if(p.extra){ $("exN").textContent = st.extra; $("exM").disabled = st.extra===0; $("exP").disabled = st.extra>=p.extra.max;
      if(p.extra.info) $("exInfo").textContent = p.extra.info(st.extra); }
  }
  if(p.tamanhos) document.querySelectorAll('input[name=tam]').forEach(r=>r.addEventListener("change",()=>{st.tam=r.value; upd()}));
  ["cor","cor2"].forEach(k=>document.querySelectorAll(`input[name=${k}]`).forEach(r=>r.addEventListener("change",()=>{st[k]=r.value; $("nome_"+k).textContent=r.value; if(window.vwColors) vwColors(st.cor,st.cor2);})));
  if(p.extra){ $("exP").onclick=()=>{st.extra++;upd()}; $("exM").onclick=()=>{st.extra--;upd()}; }
  $("qP").onclick=()=>{st.qtd++;upd()}; $("qM").onclick=()=>{st.qtd--;upd()};
  $("addBtn").onclick=()=>{ if(p.breve) return; addToCart(p, st.cor, st.extra, st.qtd, st.tam, st.cor2); toast("Adicionado ao pedido"); };
  upd();
  if(p.viewer) initViewer(p.viewer, st);
}

const VIEW_UI = {
  multi:   { intro:"Arrasta para rodar, aproxima e experimenta abrir as ferramentas.", btns:[["vwOpen","Abrir ferramentas"],["vwSpin","Rodar disco"]] },
  sardine: { intro:"Arrasta para rodar, aproxima e vê como se mexe.", btns:[["vwWave","Abanar"]] }
};
const THREE_SRC = ["https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js","https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"];
function loadScript(src){ return new Promise((ok,ko)=>{ if(document.querySelector(`script[src="${src}"]`)) return ok(); const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=ko; document.head.appendChild(s); }); }
async function initViewer(kind, st){
  window.vwColors=null;
  const canvas=$("vwC"); if(!canvas) return;
  try{ for(const u of THREE_SRC) await loadScript(u); }catch(e){ $("vwLoad").textContent="Não foi possível carregar a vista."; return; }
  if(!canvas.isConnected) return;
  const box=canvas.parentElement;
  const b64=(s,T)=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new T(u.buffer)};
  const geo=d=>{const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(b64(d.v,Float32Array),3));g.setIndex(new THREE.BufferAttribute(b64(d.f,Uint16Array),1));const ng=g.toNonIndexed();ng.computeVertexNormals();return ng};
  const col=h=>new THREE.Color(h).convertSRGBToLinear();
  const r=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true}); r.setPixelRatio(Math.min(devicePixelRatio,2)); r.outputEncoding=THREE.sRGBEncoding; r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFSoftShadowMap;
  const sc=new THREE.Scene(), cam=new THREE.PerspectiveCamera(35,1,1,2000); cam.position.set(-55,85,95);
  const ctr=new THREE.OrbitControls(cam,canvas); ctr.enableDamping=true; ctr.minDistance=60; ctr.maxDistance=260; ctr.autoRotate=true; ctr.autoRotateSpeed=1.2; ctr.enablePan=false;
  canvas.style.touchAction="pan-y";
  ctr.addEventListener("start",()=>{ctr.autoRotate=false});
  sc.add(new THREE.HemisphereLight(0xffffff,0x6a6a77,0.55));
  const key=new THREE.DirectionalLight(0xffffff,0.85); key.position.set(-60,120,80); key.castShadow=true; key.shadow.mapSize.set(2048,2048); Object.assign(key.shadow.camera,{left:-80,right:80,top:80,bottom:-80,near:10,far:400}); sc.add(key);
  const fill=new THREE.DirectionalLight(0xffffff,0.35); fill.position.set(80,40,-60); sc.add(fill);
  const gnd=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.ShadowMaterial({opacity:0.16})); gnd.rotation.x=-Math.PI/2; gnd.receiveShadow=true; sc.add(gnd);
  const model=new THREE.Group(); model.rotation.x=-Math.PI/2; sc.add(model);
  const mk=(d,m)=>{const x=new THREE.Mesh(geo(d),m); x.castShadow=true; x.receiveShadow=true; return x};
  let tick=()=>{};
  if(kind==="multi"){
    const D=MODELS.multi; ctr.target.set(0,4,8);
    const mB=new THREE.MeshStandardMaterial({color:col(0x1b1b1f),roughness:0.62}), mP=new THREE.MeshStandardMaterial({color:col(0xefefea),roughness:0.55});
    model.add(mk(D.body,mB));
    const piv=(n,c)=>{const g=new THREE.Group(); g.position.set(c[0],c[1],0); const x=mk(D[n],mP); x.position.set(-c[0],-c[1],0); g.add(x); model.add(g); return g};
    const pA=piv("toolA",D.HA), pB=piv("toolB",D.HB), pS=piv("spinner",D.SC);
    let open=0,target=0,spin=0;
    const bo=$("vwOpen"); bo.onclick=()=>{ target=target?0:1; bo.textContent=target?"Fechar ferramentas":"Abrir ferramentas"; bo.classList.toggle("on",!!target); };
    $("vwSpin").onclick=()=>{ spin+=14; };
    tick=(dt)=>{ open+=(target-open)*Math.min(1,dt*6); pA.rotation.z=open*Math.PI/2; pB.rotation.z=-open*Math.PI/2; pS.rotation.z+=spin*dt; spin*=Math.pow(0.35,dt); };
  } else {
    const D=MODELS.sardine; ctr.target.set(0,6,0); model.position.y=5.49;
    const mLo=new THREE.MeshStandardMaterial({color:col(0xbfc5cc),roughness:0.45,metalness:0.15}), mHi=new THREE.MeshStandardMaterial({color:col(0x1f4fa0),roughness:0.5});
    const VC={"Azul":0x1f4fa0,"Preto":0x1b1b1f,"Branco":0xe9ebee};
    window.vwColors=(c1,c2)=>{ if(VC[c1]!=null) mHi.color=col(VC[c1]); if(VC[c2]!=null) mLo.color=col(VC[c2]); };
    if(st) vwColors(st.cor,st.cor2);
    // chain from the head (last segment) to the tail, each joint rotates around its pivot
    const n=D.segs.length; let parent=model; const joints=[];
    const add=(g,i)=>{ const s=D.segs[i]; if(s.lo) g.add(mk(s.lo,mLo)); if(s.hi) g.add(mk(s.hi,mHi)); };
    const head=new THREE.Group(); model.add(head); add(head,n-1); parent=head; let base=[0,0];
    for(let i=n-2;i>=0;i--){
      const py=D.piv[i]; const j=new THREE.Group(); j.position.set(0,py-base[1],0); parent.add(j);
      const inner=new THREE.Group(); inner.position.set(0,-py,0); j.add(inner); add(inner,i);
      joints.push(j); parent=inner; base=[0,0];
    }
    let amp=0,ampT=0.35,t=0;
    const bw=$("vwWave"); bw.classList.add("on");
    bw.onclick=()=>{ ampT=ampT?0:0.35; bw.classList.toggle("on",!!ampT); };
    tick=(dt)=>{ t+=dt; amp+=(ampT-amp)*Math.min(1,dt*3); joints.forEach((j,k)=>{ j.rotation.z=amp*Math.sin(t*4-k*0.9)*(0.4+k*0.12); }); };
  }
  let last=performance.now();
  function size(){ const w=box.clientWidth,h=box.clientHeight; r.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix(); cam.position.setLength(w<600?200:150); }
  size(); const ro=new ResizeObserver(size); ro.observe(box);
  $("vwLoad").hidden=true;
  (function loop(t){
    if(!canvas.isConnected){ ro.disconnect(); r.dispose(); return; }
    const dt=Math.min(0.05,(t-last)/1000); last=t; tick(dt);
    ctr.update(); r.render(sc,cam); requestAnimationFrame(loop);
  })(last);
}

/* ---------- cart ---------- */
let cart = [];
try { cart = JSON.parse(localStorage.getItem("driprints-pedido")||"[]").filter(i=>byId(i.id) && !byId(i.id).breve); } catch(e){ cart = []; }
function save(){ try{ localStorage.setItem("driprints-pedido", JSON.stringify(cart)); }catch(e){} }
const basePrice = (p, tam) => { if(!p.tamanhos) return p.preco; const t=p.tamanhos.find(x=>x[0]===tam)||p.tamanhos[0]; return t[1]; };
const lineUnit = i => { const p=byId(i.id); return basePrice(p, i.tam) + (p.extra ? i.extra*p.extra.preco : 0); };
const lineDesc = i => { const p=byId(i.id); const b=[]; if(i.tam) b.push(i.tam); if(i.cor) b.push(i.cor2 ? `${i.cor} e ${i.cor2}` : i.cor); if(p.extra && i.extra) b.push(`${i.extra} ${i.extra===1?(p.extra.singular||p.extra.nome):(p.extra.plural||p.extra.nome)}`.toLowerCase()); return b.join(", "); };
function addToCart(p, cor, extra, qtd, tam=null, cor2=null){
  const f = cart.find(i=>i.id===p.id && i.cor===cor && i.extra===extra && (i.tam||null)===tam && (i.cor2||null)===cor2);
  if(f) f.qtd = Math.min(20, f.qtd+qtd); else cart.push({id:p.id, cor, extra, qtd, tam, cor2});
  save(); renderCart();
}
function renderCart(){
  const n = cart.reduce((s,i)=>s+i.qtd,0);
  $("cartCount").textContent = n;
  const sub = cart.reduce((s,i)=>s+lineUnit(i)*i.qtd,0);
  $("cartTotal").textContent = eur(sub);
  $("sendOrder").disabled = !cart.length;
  $("items").innerHTML = cart.length ? cart.map((i,k)=>{ const p=byId(i.id); return `
    <li class="item"><div class="thumb"><img src="${p.imagem}" alt=""></div>
      <div><b>${esc(p.nome)}</b><small>${esc(lineDesc(i))}</small><small>${eur(lineUnit(i))} cada</small></div>
      <div class="side"><strong>${eur(lineUnit(i)*i.qtd)}</strong>
        <div class="stepper"><button type="button" data-k="${k}" data-d="-1" aria-label="Menos uma unidade">−</button><output>${i.qtd}</output><button type="button" data-k="${k}" data-d="1" aria-label="Mais uma unidade" ${i.qtd>=20?"disabled":""}>+</button></div></div></li>`}).join("")
    : `<li class="empty">O pedido está vazio. Escolhe um produto e adiciona-o aqui.</li>`;
}
$("items").addEventListener("click", e=>{
  const b = e.target.closest("button[data-k]"); if(!b) return;
  const i = cart[+b.dataset.k]; i.qtd += +b.dataset.d;
  if(i.qtd<=0) cart.splice(+b.dataset.k,1);
  save(); renderCart();
});
function openCart(o){ document.body.classList.toggle("cart-open",o); $("drawer").setAttribute("aria-hidden", String(!o)); if(o) $("closeCart").focus(); }
$("openCart").onclick=()=>openCart(true);
$("closeCart").onclick=()=>openCart(false);
$("scrim").onclick=()=>openCart(false);
document.addEventListener("keydown", e=>{ if(e.key==="Escape") openCart(false); });
$("sendOrder").onclick=()=>{
  if(!cart.length) return;
  const linhas = cart.map(i=>{ const p=byId(i.id); const d=lineDesc(i); return `• ${i.qtd}× ${p.nome}${d?` (${d})`:""}: ${eur(lineUnit(i)*i.qtd)}`; });
  const msg = `Olá DriPrints! Quero encomendar:\n${linhas.join("\n")}\nTotal: ${$("cartTotal").textContent}`;
  if(!LOJA.whatsapp){ toast("As encomendas abrem em breve."); return; }
  window.open("https://wa.me/"+LOJA.whatsapp+"?text="+encodeURIComponent(msg),"_blank","noopener");
};
function toast(t){ const e=$("toast"); e.textContent=t; e.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove("show"),2400); }

/* ---------- routing ---------- */
let view = null;
function route(hh){
  const h = typeof hh==="string" ? hh : decodeURIComponent(location.hash.slice(1));
  const p = byId(h);
  if(p){
    if(view!==p.id){ product(p); view=p.id; document.title = p.breve ? "Em breve | DriPrints" : `${p.nome} | DriPrints`; }
    window.scrollTo(0,0);
  } else {
    if(view!=="home"){ home(); view="home"; document.title = "DriPrints | Objetos úteis para o dia a dia"; }
    const el = h && document.getElementById(h);
    if(el) el.scrollIntoView(); else window.scrollTo(0,0);
  }
}
window.addEventListener("hashchange", ()=>route());
window.addEventListener("popstate", ()=>route());
/* links internos: abrem sem depender da navegação do browser (funciona também em pré-visualizações) */
function go(h){
  try{ if(decodeURIComponent(location.hash.slice(1))!==h) history.pushState(null,"",h?"#"+h:location.pathname+location.search); }catch(e){}
  route(h);
}
document.addEventListener("click", e=>{
  const a = e.target.closest('a[href^="#"]'); if(!a || e.ctrlKey || e.metaKey || e.shiftKey) return;
  e.preventDefault(); go(decodeURIComponent(a.getAttribute("href").slice(1)));
});
